aid: domio
name: Domio
description: >-
  Domio was a New York City hospitality and real-estate technology company that designed,
  leased, and operated branded "apart-hotels" — spacious, design-forward apartment-style
  accommodations aimed at group and extended-stay travelers. Founded in June 2016 by former
  Bank of America Merrill Lynch real-estate bankers Jay Roberts and Adrian Lam, the company
  used data analysis and machine learning to select buildings for its portfolio and
  distributed inventory through its own site and app alongside third-party channels such as
  Airbnb. It raised roughly $117M across five rounds, including a $12M Series A in 2018 from
  Tribeca Venture Partners and SoftBank Capital, a $50M joint-venture facility from Upper90,
  and a $100M Series B in December 2019 (half equity, half debt) led by GGV Capital with
  Eldridge Industries, 3L Capital, Cain International and Tenaya Capital. Airbnb suspended
  all of Domio's host accounts in August 2020, the co-founders resigned that September, and
  the company ceased operations in November 2020, selling its assets through an assignment
  for the benefit of creditors overseen by Sherwood Partners. Domio never published a
  developer program, public API, SDK, or machine-readable specification. Its former host
  staydomio.com was re-registered on 2021-09-19 by an unrelated party and now serves a
  GoDaddy parking lander, so it is deliberately not wired as a Website pointer. This profile
  is retained as a historical record; there is no API surface to enrich.
