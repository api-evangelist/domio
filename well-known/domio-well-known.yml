description: >-
  Negative probe record for Domio. Domio Inc. ceased operations in November 2020 and
  sold its assets through an assignment for the benefit of creditors. Its former host
  staydomio.com was re-registered on 2021-09-19 (GoDaddy / Domains By Proxy) by an
  unrelated party and now serves a GoDaddy parking lander. That lander answers HTTP 200
  with the SAME 114-byte HTML redirect shell for EVERY path, including every
  /.well-known/* and every spec path. NONE of these 200s is a document. No WellKnown,
  SecurityTxt, AgentCard, LLMsTxt or OpenAPI pointer is emitted from this probe, and
  none should ever be emitted from it in a later round.

